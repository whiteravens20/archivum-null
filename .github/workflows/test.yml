name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Tests
        run: npm run test

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # At start the server gives every built asset a random public name and rewrites
      # the references to it that it can find: literal /assets/<name> strings
      # (backend/src/static/assetCloak.ts). The chunks of a split build import each
      # other by relative path, which is not rewritten, so a second script would not
      # load in production.
      - name: One script in the build
        run: |
          count=$(find dist/assets -name '*.js' | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::The frontend build emitted $count scripts. The asset cloak handles one; see backend/src/static/assetCloak.ts."
            exit 1
          fi

      - name: Tests
        run: npm run test

  docker:
    name: Validate Docker build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (validate only — no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # push: false + load: false = full build exercised, result discarded.
          # This is the fastest way to validate the Dockerfile without storing
          # an image in the runner or a registry.
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
