name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        id: install
        run: npm ci --ignore-scripts

      - name: Label quarantined PR
        if: failure() && steps.install.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"
          if npm ci --ignore-scripts --dry-run 2>&1 | grep -qiE "min-release-age|ERESOLVE|could not resolve"; then
            gh pr edit ${{ github.event.pull_request.number }} --add-label "min-release-age"
          fi

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Tests
        run: npm run test

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        id: install
        run: npm ci --ignore-scripts

      - name: Label quarantined PR
        if: failure() && steps.install.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"
          if npm ci --ignore-scripts --dry-run 2>&1 | grep -qiE "min-release-age|ERESOLVE|could not resolve"; then
            gh pr edit ${{ github.event.pull_request.number }} --add-label "min-release-age"
          fi

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Tests
        run: npm run test

  docker:
    name: Validate Docker build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (validate only — no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          # push: false + load: false = full build exercised, result discarded.
          # This is the fastest way to validate the Dockerfile without storing
          # an image in the runner or a registry.
          push: false
          load: false
          build-args: |
            MAX_FILE_SIZE=104857600
            TURNSTILE_SITE_KEY=0x0000000000000000000000
            DEFAULT_TTL=86400
            DEFAULT_MAX_DOWNLOADS=10
            CHUNK_SIZE=52428800
          cache-from: type=gha
          cache-to: type=gha,mode=max
