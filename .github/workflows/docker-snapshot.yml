# ── Archivum Null — Snapshot Builds ───────────────────────────────────────────
#
# Publishes a Docker snapshot image ON DEMAND only (manual workflow_dispatch).
# Run it from the branch you want to snapshot — nothing is built automatically.
# These are NOT production releases — use a semver tag for that.
#
# Scan behaviour (based on the branch the workflow is run from):
#   dev   → build, scan REPORTS ONLY (exit-code 0, warns only), then tag :dev
#   main  → build, scan FAILS on HIGH/CRITICAL (last bastion), then tag :edge
#           only if the scan passed
#
# The image is pushed by its digest alone and scanned there; the tags are put on
# it only after the scan, so a pull of :edge never meets an image it failed.
#
# Tags produced:
#   dev  branch  →  ghcr.io/<owner>/<repo>:dev   + :dev-<7-char-sha>
#   main branch  →  ghcr.io/<owner>/<repo>:edge  + :edge-<7-char-sha>
#
# ─────────────────────────────────────────────────────────────────────────────

name: Snapshot build

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  build-push:
    name: Build ${{ github.ref_name }} snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image-ref: ${{ steps.img-ref.outputs.ref }}
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.tag.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute snapshot tags
        id: tag
        run: |
          PREFIX=$([ "${{ github.ref_name }}" == "dev" ] && echo "dev" || echo "edge")
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          {
            echo "value<<EOF"
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${PREFIX}"
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${PREFIX}-${SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # No tag yet: the `tag` job puts the tags on this digest after the scan.
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          # APP_VERSION is not a release tag here: the panel shows it verbatim and
          # skips the release comparison rather than pretending a snapshot is a version.
          build-args: |
            CACHE_BUST_APK=${{ github.run_id }}
            APP_VERSION=edge-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve image ref for scan
        id: img-ref
        # Scan by immutable digest from the registry.
        run: echo "ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  # ── Trivy scan ────────────────────────────────────────────────────────────────
  #   dev   → exit-code 0  findings reported to Security tab; build stays green
  #   main  → exit-code 1  fails; last bastion before a production release tag
  # Add CVE IDs to .trivyignore (with justification) to acknowledge and unblock.
  scan:
    name: Trivy scan
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Checkout (for .trivyignore)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan for CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ needs.build-push.outputs.image-ref }}
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
          limit-severities-for-sarif: true
          # dev → 0 (warn only, do not block dev iteration)
          # main → 1 (blocking — last bastion before a production release tag)
          exit-code: ${{ github.ref_name == 'main' && '1' || '0' }}
          format: sarif
          output: trivy-snapshot.sarif

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: trivy-snapshot.sarif
          category: trivy-snapshot

  # ── Tags ──────────────────────────────────────────────────────────────────────
  # Runs only once the scan has: from `main` only when it passed, from `dev`
  # whatever it reported. Each tag must then name the very digest that was scanned.
  tag:
    name: Tag the scanned image
    needs: [build-push, scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Put the tags on the scanned digest
        env:
          TAGS: ${{ needs.build-push.outputs.tags }}
          DIGEST: ${{ needs.build-push.outputs.digest }}
        run: |
          args=()
          while IFS= read -r tag; do [ -n "$tag" ] && args+=(--tag "$tag"); done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            got=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')
            [ "$got" = "$DIGEST" ] || { echo "::error::$tag names $got, not the scanned $DIGEST"; exit 1; }
            echo "$tag -> $got"
          done <<< "$TAGS"
