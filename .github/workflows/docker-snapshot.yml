# ── Archivum Null — Snapshot Builds ───────────────────────────────────────────
#
# Publishes a Docker snapshot image ON DEMAND only (manual workflow_dispatch).
# Run it from the branch you want to snapshot — nothing is built automatically.
# These are NOT production releases — use a semver tag for that.
#
# Scan behaviour (based on the branch the workflow is run from):
#   dev   → build + push :dev tag;  scan REPORTS ONLY (exit-code 0, warns only)
#   main  → build + push :edge tag; scan FAILS on HIGH/CRITICAL (last bastion)
#
# Tags produced:
#   dev  branch  →  ghcr.io/<owner>/<repo>:dev   + :dev-<7-char-sha>
#   main branch  →  ghcr.io/<owner>/<repo>:edge  + :edge-<7-char-sha>
#
# ─────────────────────────────────────────────────────────────────────────────

name: Snapshot build

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  build-push:
    name: Build ${{ github.ref_name }} snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image-ref: ${{ steps.img-ref.outputs.ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute snapshot tags
        id: tag
        run: |
          PREFIX=$([ "${{ github.ref_name }}" == "dev" ] && echo "dev" || echo "edge")
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          {
            echo "value<<EOF"
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${PREFIX}"
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${PREFIX}-${SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.tag.outputs.value }}
          # VITE_ vars are public build-time constants. Fallback defaults are used
          # when repository variables are not configured.
          build-args: |
            CACHE_BUST_APK=${{ github.run_id }}
            # Not a release tag — the panel shows it verbatim and skips the
            # release comparison rather than pretending a snapshot is a version.
            APP_VERSION=edge-${{ github.sha }}
            VITE_MAX_FILE_SIZE=${{ vars.VITE_MAX_FILE_SIZE || '104857600' }}
            VITE_TURNSTILE_SITE_KEY=${{ vars.VITE_TURNSTILE_SITE_KEY || '0x0000000000000000000000' }}
            VITE_DEFAULT_TTL=${{ vars.VITE_DEFAULT_TTL || '86400' }}
            VITE_DEFAULT_MAX_DOWNLOADS=${{ vars.VITE_DEFAULT_MAX_DOWNLOADS || '10' }}
            VITE_CHUNK_SIZE=${{ vars.VITE_CHUNK_SIZE || '52428800' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve image ref for scan
        id: img-ref
        # Scan by immutable digest from the registry.
        run: echo "ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  # ── Trivy scan ────────────────────────────────────────────────────────────────
  #   dev   → exit-code 0  findings reported to Security tab; build stays green
  #   main  → exit-code 1  fails; last bastion before a production release tag
  # Add CVE IDs to .trivyignore (with justification) to acknowledge and unblock.
  scan:
    name: Trivy scan
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Checkout (for .trivyignore)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan for CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ needs.build-push.outputs.image-ref }}
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
          limit-severities-for-sarif: true
          # dev → 0 (warn only, do not block dev iteration)
          # main → 1 (blocking — last bastion before a production release tag)
          exit-code: ${{ github.ref_name == 'main' && '1' || '0' }}
          format: sarif
          output: trivy-snapshot.sarif

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: trivy-snapshot.sarif
          category: trivy-snapshot
