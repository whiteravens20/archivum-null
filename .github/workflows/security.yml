name: Security

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Weekly on Monday at 09:00 UTC
    - cron: '0 9 * * 1'

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # Production deps get a tighter bar (moderate) — these ship to users.
      # Dev deps stay at high to keep noise manageable.
      - name: Audit backend (production, moderate)
        working-directory: backend
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit backend (dev, high)
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Audit frontend (production, moderate)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit frontend (dev, high)
        working-directory: frontend
        run: npm audit --audit-level=high

      # Verify every installed tarball has a valid registry signature.
      # Catches forged tarballs / tampered registry metadata at install time.
      # Requires a fresh install since `audit signatures` reads node_modules.
      - name: Install backend (for signature audit)
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Verify backend signatures
        working-directory: backend
        run: npm audit signatures

      - name: Install frontend (for signature audit)
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Verify frontend signatures
        working-directory: frontend
        run: npm audit signatures

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    # Only runs on pull requests — compares new deps against known vulnerabilities
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/dependency-review-action@v4.9.0
        with:
          fail-on-severity: high

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy on repository
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-fs.sarif
          trivyignores: .trivyignore
          limit-severities-for-sarif: true
          exit-code: '1'  # Fail the build on HIGH/CRITICAL vulnerabilities

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  trivy-docker:
    name: Trivy Docker image scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t archivum-null:ci .

      - name: Run Trivy on Docker image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: archivum-null:ci
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-docker.sarif
          trivyignores: .trivyignore
          limit-severities-for-sarif: true
          exit-code: '1'  # Fail the build on HIGH/CRITICAL vulnerabilities

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-docker.sarif
          category: trivy-docker
