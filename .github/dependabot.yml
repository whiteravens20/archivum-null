# ── Dependabot configuration ──────────────────────────────────────────────────
# Keeps GitHub Actions, npm dependencies and the Docker base image up to date
# automatically. Opens PRs against `dev`, weekly for npm and the base image and
# monthly for actions — CI must pass before merging.
#
# Versioning strategy:
#   - github-actions: bumps the commit SHA and the version comment in `uses:`
#     lines; minor and patch bumps come as one PR, a major on its own
#   - npm: respects semver ranges in package.json; groups minor+patch into one PR,
#     and vitest with its plugins into a PR of their own for every kind of bump
#   - docker: bumps the version and the digest in `FROM` lines, or the digest
#     alone when the same version is rebuilt; a new major of Node is not proposed
#
# Supply-chain quarantine: every ecosystem below sets `cooldown: 7`, so Dependabot
# will not even propose a version until it has been public for a week. This is the
# primary enforcement point for the 7-day release-age policy — a version that is
# too fresh never becomes a PR, so it can never be merged early. `.npmrc`
# `min-release-age=7` remains as the client-side backstop for manual installs.

version: 2

updates:
  # ── GitHub Actions ───────────────────────────────────────────────────────────
  # Dependabot will bump the SHA pins and update the # vX.Y.Z comments
  # when new releases of used actions are published.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
      time: "08:00"
      timezone: UTC
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
    # Let a newly published version settle for a week before proposing it. A tag
    # can be repointed or a release yanked in the hours after it lands, and none
    # of these bumps is urgent. A pinned action gets no Dependabot alert, so the
    # "Actions audit" job in security.yml watches the advisory database instead.
    cooldown:
      default-days: 7
    groups:
      actions-non-breaking:
        update-types:
          - minor
          - patch

  # ── Backend npm ──────────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /backend
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: UTC
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: "chore(backend)"
    # Same week-long settling window: a freshly published npm version is the one
    # most likely to be a compromised or broken release. `cooldown` governs
    # version updates only — Dependabot security updates are exempt by design and
    # still open the moment an advisory lands, which is what we want.
    cooldown:
      default-days: 7
    # Group all non-breaking updates into a single PR to reduce noise.
    # Security updates are always opened as separate PRs regardless.
    groups:
      # @vitest/coverage-v8 pins vitest to its own exact version, so neither can be
      # bumped alone. They always update together here; the non-breaking group
      # excludes them so they cannot match both.
      backend-vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      backend-non-breaking:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "vitest"
          - "@vitest/*"

  # ── Frontend npm ─────────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: UTC
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: "chore(frontend)"
    # Same week-long settling window; security updates stay exempt.
    cooldown:
      default-days: 7
    groups:
      # Same exact-version pin as in the backend.
      frontend-vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      frontend-non-breaking:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "vitest"
          - "@vitest/*"

  # ── Docker base image ────────────────────────────────────────────────────────
  # Both Dockerfiles pin node by version and digest. A new minor or patch moves
  # the two together; a rebuild of the same version moves the digest alone.
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: UTC
    labels:
      - dependencies
    commit-message:
      prefix: "chore(docker)"
    # Same week-long settling window, for a new version and for a rebuilt one.
    cooldown:
      default-days: 7
    # A new major of Node is a change to the project, made by hand together with
    # `node-version` in the workflows.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
